name: Auto-Repack StevenMXZ Turnip

# Runs on a schedule, resolves the newest mainline A7xx Turnip build published by
# StevenMXZ, repacks it into a Magisk/KernelSU module and publishes a release in
# this repository. Already-released versions are skipped, so a scheduled run with
# no upstream change is a no-op.
#
# Upstream: https://github.com/StevenMXZ/Adreno-Tools-Drivers
#
# Selection rules (see the Resolve step):
#   - assets named Turnip_v<version>.zip          -> mainline A7xx (used)
#   - assets containing Gen8 / Oneui / Patched    -> skipped
#   - any other release (e.g. proprietary vNNN)   -> skipped

on:
  schedule:
    # Daily at 06:00 UTC (09:00 Europe/Minsk).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if a release for this version already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-repack-stevenmxz
  cancel-in-progress: false

jobs:
  repack:
    name: Resolve and Repack
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Latest Upstream Build
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "skip=true" >> "$GITHUB_OUTPUT"

          # Fetch the 50 newest upstream releases.
          if ! curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'User-Agent: auto-repack' \
              'https://api.github.com/repos/StevenMXZ/Adreno-Tools-Drivers/releases?per_page=50' \
              -o releases.json; then
            echo '::warning::Could not fetch upstream releases; nothing to do.'
            exit 0
          fi

          # Pick the newest release that carries a mainline A7xx Turnip asset.
          selection="$(jq -r '
            [ .[]
              | {
                  published: (.published_at // .created_at),
                  asset: (
                    [ .assets[]
                      | select(.name | test("^Turnip_v[0-9][^/]*\\.zip$"; "i"))
                      | select(.name | test("gen8|oneui|patched"; "i") | not)
                    ] | first
                  )
                }
              | select(.asset != null)
            ]
            | sort_by(.published)
            | last
            | "\(.published)\t\(.asset.name)\t\(.asset.browser_download_url)"
          ' releases.json)"

          if [ -z "$selection" ] || [ "$selection" = "null" ]; then
            echo '::warning::No matching mainline A7xx asset found upstream.'
            exit 0
          fi

          published="$(printf '%s' "$selection" | cut -f1)"
          asset="$(printf '%s' "$selection" | cut -f2)"
          url="$(printf '%s' "$selection" | cut -f3)"

          # Turnip_v27.0.0-R2.zip -> 27.0.0-R2
          version="$(printf '%s' "$asset" | sed -E 's/^[Tt]urnip_v//; s/\.zip$//')"
          tag="stevenmxz-${version}"
          vcode="$(date -u -d "$published" +%Y%m%d)"

          echo "asset=$asset"     >> "$GITHUB_OUTPUT"
          echo "url=$url"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "vcode=$vcode"     >> "$GITHUB_OUTPUT"

          echo "Resolved: $asset (published $published)"
          echo "Version:  $version"
          echo "Tag:      $tag"
          echo "Code:     $vcode"

          # Skip when this version was already published, unless forced.
          force='false'
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && \
             [ "${{ inputs.force }}" = 'true' ]; then
            force='true'
          fi

          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'User-Agent: auto-repack' \
            "https://api.github.com/repos/$REPO/releases/tags/$tag")"

          if [ "$code" = '200' ] && [ "$force" != 'true' ]; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install Tools
        if: steps.resolve.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf unzip curl zip

      - name: Repack Driver as Magisk Module
        if: steps.resolve.outputs.skip != 'true'
        env:
          DRIVER_URL: ${{ steps.resolve.outputs.url }}
          DRIVER_LIB: libvulkan_freedreno.so
          VER: ${{ steps.resolve.outputs.version }}
          VCODE: ${{ steps.resolve.outputs.vcode }}
          DRIVER_AUTHOR: StevenMXZ
          MESA_STREAM: Turnip (StevenMXZ mainline)
        run: |
          bash repack-turnip-module.sh

      - name: Verify Module Contents
        if: steps.resolve.outputs.skip != 'true'
        env:
          VER: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="turnip_workdir/Turnip-${VER}-MAGISK-KSU.zip"
          test -f "$ZIP"
          unzip -l "$ZIP"
          unzip -p "$ZIP" module.prop

          unzip -o -q "$ZIP" 'system/vendor/lib64/hw/vulkan.adreno.so' -d /tmp/verify
          SO=/tmp/verify/system/vendor/lib64/hw/vulkan.adreno.so
          file "$SO"
          readelf -h "$SO" | grep -E 'Class|Data|Machine'
          readelf -d "$SO" | grep -E 'SONAME|NEEDED' || true

          # Guard against a silently empty or wrong-arch payload.
          size="$(stat -c %s "$SO")"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::Packaged driver is suspiciously small ($size bytes)."
            exit 1
          fi

      - name: Publish Release
        if: steps.resolve.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: Turnip ${{ steps.resolve.outputs.version }} (StevenMXZ)
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Repacked from the upstream community build by **StevenMXZ**:
            [Adreno-Tools-Drivers](https://github.com/StevenMXZ/Adreno-Tools-Drivers)

            - Upstream asset: `${{ steps.resolve.outputs.asset }}`
            - Magisk / KernelSU / APatch module, replaces
              `system/vendor/lib64/hw/vulkan.adreno.so`
            - Version code: `${{ steps.resolve.outputs.vcode }}`
            - Driver is repacked **as-is**; no patches are added or removed.

            Reboot after installing the module.
          files: |
            turnip_workdir/Turnip-${{ steps.resolve.outputs.version }}-MAGISK-KSU.zip
            turnip_workdir/Turnip-${{ steps.resolve.outputs.version }}-EMULATOR.zip
            turnip_workdir/vulkan.turnip.so

      - name: Upload Artifacts
        if: always() && steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-AutoRepack-${{ steps.resolve.outputs.version }}
          path: |
            turnip_workdir/Turnip-*.zip
            turnip_workdir/vulkan.turnip.so
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          SKIP: ${{ steps.resolve.outputs.skip }}
          VER: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          {
            echo "### Auto-repack result"
            echo
            if [ "$SKIP" = 'true' ]; then
              echo "Nothing to do: no newer upstream build, or it was already released."
            else
              echo "- Version: \`$VER\`"
              echo "- Tag: \`$TAG\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
